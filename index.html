<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DistillLab · Coming Soon</title>
<meta name="description" content="AI 分身劳动力工坊 · 即将上线">
<style>
:root{--ink:#26215C;--muted:#5F5E5A;--accent:#534AB7;--accent-soft:#EEEDFE;--line:#D3D1C7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#fff;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.mark{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:28px;letter-spacing:1px}
h1{font-size:34px;font-weight:600;letter-spacing:1px}
h1 .lab{color:var(--accent)}
.sub{margin-top:14px;font-size:16px;color:var(--muted);letter-spacing:2px}
.words{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.words span{padding:6px 18px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;border:1px solid var(--accent)}
.gh{margin-top:40px;display:inline-block;padding:12px 32px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-size:15px;letter-spacing:1px}
.gh:hover{opacity:.9}
.note{margin-top:18px;font-size:13px;color:var(--muted)}
footer{padding:20px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="hero">
  <div class="mark">DL</div>
  <h1>Distill<span class="lab">Lab</span></h1>
  <p class="sub">分身自动化制作系统 · 即将上线</p>
  <div class="words">
    <span>研报蒸馏</span><span>深度研究</span><span>书籍蒸馏</span><span>人格分身</span><span>经验萃取</span><span>家族记忆</span>
  </div>
  <a class="gh" href="https://github.com/distilllab/yanbao-distill">GitHub · 开源进行中</a>
  <p class="note">四分身流水线：选题 → 蒸馏 → 审校 → 归档 · 每单核验记录公开</p>
</div>
<footer>
  © 2026 DistillLab · <a href="https://github.com/distilllab">github.com/distilllab</a>
</footer>
</body>
</html>
