<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DistillLab 蒸馏研究室 · 拥抱 AI 蒸出未来</title>
<meta name="description" content="AI 与企业握手的地方。我们把老师傅的手艺、企业的数据、厚厚的资料，蒸馏成一页一页用得上的知识。第一个落地案例：制造业老师傅经验萃取。全程线上交付。">
<style>
:root{--paper:#fffef9;--ink:#25352e;--green:#639922;--green2:#3B6D11;--muted:#68726a;--line:#d9d6c8;--tint:#eaf0ea}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.75;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 26px;width:100%}
@media(max-width:560px){.brand small{display:none}header .links{gap:14px}}

header{padding:20px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.mark{font-size:22px;letter-spacing:-2px;font-weight:900;border:2px solid var(--green);padding:0 8px;color:var(--green)}
.brand b{font-size:16px;display:block;line-height:1.2}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:2px}
header .links{display:flex;gap:22px;font-size:13.5px}
header .links a{text-decoration:none;color:var(--muted)}
header .links a:hover{color:var(--green)}
header .links a.free{color:var(--green);font-weight:700}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 8px}
.eyebrow{text-align:center;font-size:13px;letter-spacing:3px;color:var(--muted);margin-bottom:20px}
h1{text-align:center;font-size:clamp(38px,6.5vw,64px);line-height:1.22;color:var(--ink);font-weight:800;letter-spacing:2px}
h1 .zheng{color:var(--green)}
.vision{text-align:center;color:var(--muted);font-size:15px;margin:22px auto 30px;max-width:580px;text-wrap:balance}
.vision b{color:var(--ink)}

.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}
.cta{display:inline-block;padding:14px 34px;border-radius:12px;background:var(--green);color:#fff;text-decoration:none;font-size:15.5px;font-weight:700;letter-spacing:1px}
.cta:hover{background:#27500a}
.quick{max-width:640px;margin:0 auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quick a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:#fff}
.quick a:hover{border-color:var(--green);color:var(--green)}
.quick a.flag{color:var(--green);border-color:var(--green);font-weight:700;background:var(--tint)}


/* 握手桥动画 */
.bridge{margin:40px auto 0;max-width:640px}
.bridge svg{width:100%;display:block}
@media(prefers-reduced-motion:no-preference){
 .pulse{animation:pl 2.6s ease-in-out infinite}
 @keyframes pl{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
 .flow{stroke-dasharray:6 8}
 @keyframes fl{to{stroke-dashoffset:-28}}
}

.contactline{display:flex;gap:46px;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:14px 2px}
.cl-item{display:flex;gap:12px;align-items:center;font-size:14px}
.cl-item img{width:56px;height:56px;border-radius:6px;border:1px solid var(--line)}
.clmail{font-weight:700;color:var(--ink)}
.mark-line{font-size:12px;color:var(--muted);letter-spacing:3px;margin:10px 0 0;text-align:center}
.trust{border-top:1px solid var(--line);margin-top:42px;padding:22px 0 8px}
.trust .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.trust div{font-size:12.5px;color:var(--muted);text-align:center}
.trust div b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}

footer{padding:16px 0 26px}
footer .wrap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);flex-wrap:wrap;gap:8px}
footer a{color:var(--green);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:680px){
 h1{font-size:34px}
 header .links a.free{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark">DL</span>
      <span><b>DistillLab 蒸馏研究室</b><small>AI 与企业握手的地方</small></span>
    </a>
    <div class="links">
      <a href="app.html">全部案例</a>
      <a class="free" href="app.html#contact">免费诊断</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="eyebrow">DISTILLLAB · 握手平台第一站</div>
  <h1>您给问题，<span class="zheng">我给答案</span></h1>

  <div class="actions">
    <a class="cta" href="app.html">案例</a>
    <a class="cta" href="custom.html">您的问题？</a>
  </div>

  <div class="contactline">
    <div class="cl-item"><img src="assets/wecom-qr.png" alt="企业微信二维码"><div>企业微信 · 扫码添加</div></div>
    <div class="cl-item"><a class="clmail" href="mailto:hello@distilllab.cn">hello@distilllab.cn</a><div>邮件联系</div></div>
  </div>
  <p class="mark-line">拥抱 AI，蒸出未来</p>

  <div class="bridge">
    <svg viewBox="0 0 640 150" width="100%" role="img" aria-label="AI 与企业经验握手的示意">
      <line x1="30" y1="60" x2="290" y2="60" stroke="#639922" stroke-width="2" class="flow"/>
      <line x1="350" y1="60" x2="610" y2="60" stroke="#8a8f88" stroke-width="2" class="flow"/>
      <circle cx="320" cy="60" r="7" fill="#639922" class="pulse"/>
      <text x="30" y="34" font-size="13" fill="#536056">老师傅的经验 · 企业的数据</text>
      <text x="610" y="34" font-size="13" fill="#536056" text-anchor="end">AI 的整理与核验能力</text>
      <text x="320" y="96" font-size="13" fill="#639922" text-anchor="middle" font-weight="700">握手 →</text>
      <text x="320" y="120" font-size="12" fill="#68726a" text-anchor="middle">产出：一页一页用得上、查得到、可复核的知识</text>
    </svg>
  </div>

  <div class="trust">
    <div class="wrap">
      <div><b>全程线上</b>视频访谈 · 远程复核 · 不必见面</div>
      <div><b>核验纪律</b>每条信息带来源，可复核</div>
      <div><b>免费开始</b>48 小时诊断一个交接难题</div>
      
    </div>
  </div>

</main>

<footer>
  <div class="wrap">
    <span>© 2026 DistillLab 蒸馏研究室</span>
    <span>「蒸」——我们的本行：把厚的，蒸成薄的。</span>
    <a href="https://github.com/distilllab">GitHub 开源</a>
  </div>
</footer>

</body>
</html>
