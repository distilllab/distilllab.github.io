.bridge{margin:44px auto 0;max-width:640px}
.bridge svg{width:100%;display:block}
@media(prefers-reduced-motion:no-preference){
 .pulse{animation:pl 2.6s ease-in-out infinite}
 @keyframes pl{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
 .flow{stroke-dasharray:6 8;animation:fl 1.6s linear infinite}
 @keyframes fl{to{stroke-dashoffset:-28}}

.trust{border-top:1px solid #33503f;margin-top:44px;padding:22px 0 10px}

@media(max-width:680px){
