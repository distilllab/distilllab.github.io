<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 + 案例视频 · DistillLab 蒸馏研究室</title>
<meta name="description" content="DistillLab 蒸馏研究室：想到什么写什么的留言板，和持续更新的案例视频。48 小时免费诊断一个交接难题。">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>
:root{--paper:#f4f2eb;--ink:#25352e;--green:#639922;--deep:#1f3a2c;--muted:#68726a;--line:#cbd0c6;--white:#fffef9;--soft:#e9efe8}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.7}
a{color:inherit}
button{cursor:pointer;font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px;width:100%}

header{border-bottom:1px solid var(--line);padding:16px 0;background:var(--paper);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.mark{font-size:20px;letter-spacing:-2px;font-weight:900;border:2px solid var(--green);padding:0 8px;color:var(--green)}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px}
header .links{display:flex;gap:20px;font-size:13.5px;align-items:center}
header .links a{text-decoration:none;color:var(--muted)}
header .links a:hover{color:var(--green)}
header .links a.free{color:var(--green);font-weight:700}

/* ===== 留言板（置顶，免费诊断直达） ===== */
#msg{padding:18px 0 24px}
#msg h1{font-size:28px;margin-bottom:6px}
#msg .lead{color:var(--muted);font-size:14px;margin-bottom:20px}
.msgbox{background:var(--green);border-radius:18px;padding:30px 28px;color:var(--white);max-width:680px}
#f-msg{display:block;width:100%;min-height:190px;resize:vertical;padding:16px 16px;border-radius:12px;border:none;background:var(--white);color:var(--ink);font:inherit;font-size:14.5px}
#f-msg:focus{outline:3px solid #fff}
.mrow{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-top:12px}
.mrow button{padding:9px 18px;border-radius:10px;border:1.5px dashed #bcd8c8;background:transparent;color:#fffef9;font:inherit;font-size:13.5px}
.mrow button:hover{border-color:#fff;background:rgba(255,255,255,.08)}
#fsum{font-size:12.5px;color:#d7e6dd}
#thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#thumbs:not(:empty){margin-bottom:12px}
#thumbs .th{display:inline-flex;align-items:center;gap:6px;background:var(--white);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:12px;max-width:220px}
#thumbs .th img{width:34px;height:34px;object-fit:cover;border-radius:5px;flex:none}
#thumbs .th span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#thumbs .th button{border:none;background:none;color:#a55;font-weight:700;font-size:15px;padding:0 2px;flex:none}
#f-contact{display:block;width:100%;margin-top:14px;padding:12px 14px;border-radius:10px;border:none;background:var(--white);color:var(--ink);font:inherit;font-size:14px}
#send{margin-top:16px;padding:13px 44px;border-radius:11px;border:none;background:var(--white);color:var(--deep);font-weight:700;font-size:15px}
#send:disabled{opacity:.6}
#st{min-height:20px;font-size:13px;color:#cde8d8;margin:12px 0 0}
.msgfoot{margin-top:12px;font-size:12px;color:#bcd8c8}

/* ===== 案例视频（小红书式瀑布流） ===== */
#videos{padding:40px 0 60px}
.vhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.vhead h2{font-size:24px}
.vchip{font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:2px 12px;font-weight:700}
.vhint{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.vcard{margin:0;position:relative;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vcard video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#14170f;cursor:pointer}
/* 封面上的播放提示：纯装饰，点击穿透到 video */
.vcard .play{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(20,23,15,.5);border:2px solid rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.vcard .play::before{content:"";width:0;height:0;border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vcard:hover .play{background:rgba(99,153,34,.85)}
.vcard figcaption{padding:9px 11px;font-size:13px;font-weight:700;line-height:1.45}
.vcard .no{color:var(--green);font-size:11px;font-weight:700;margin-right:6px}
.vcard.soon{border:1.5px dashed var(--line);background:none;display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--muted);font-size:13px}
#totop{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:22px;line-height:1;box-shadow:0 4px 14px rgba(31,58,44,.35);z-index:50;display:none;align-items:center;justify-content:center}
#totop.show{display:inline-flex}
#totop:hover{background:#4d7d1a}
#totop:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
#vp{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(16,19,12,.95);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overscroll-behavior:contain;touch-action:none}
#vp.on{display:flex}
#vp video{width:auto;height:auto;max-width:min(100%,calc(88vh * 9 / 16));max-height:88vh;object-fit:contain;border-radius:10px}
#vpc{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:var(--white);color:var(--deep);font-size:22px;font-weight:700;z-index:101}

footer{border-top:1px solid var(--line);padding:22px 0 30px}
footer .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
footer a{color:var(--green);text-decoration:none}
@media(max-width:560px){.brand small{display:none}header .links{gap:14px}#msg h1{font-size:24px}.grid{gap:10px}}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="brand" href="/"><span class="mark" aria-hidden="true">DL</span><span><b>蒸馏研究室</b><small>DISTILLLAB</small></span></a>
  <nav class="links" aria-label="主导航">
    <a href="#msg">留言板</a>
    <a href="#videos">案例视频</a>
    <a class="free" href="#msg">免费诊断</a>
  </nav>
</div></header>

<main>
  <!-- 留言板：免费诊断直达，上面没有任何东西 -->
  <section id="msg" class="wrap">
    <h1>想到什么写什么</h1>
    <p class="lead">不用想格式、不用填格子——困惑、想法，随手拍的照片或视频，直接留下就行。48 小时内回复适不适合做；不合适直接告诉你。</p>
    <div class="msgbox">
      <textarea id="f-msg" placeholder="想到什么写什么。比如：车间里哪一步最头疼？想把手艺交给谁？手头有什么资料、想做成什么样？……"></textarea>
      <div class="mrow">
        <button id="picki" type="button">＋ 图片</button>
        <button id="pickv" type="button">＋ 视频</button>
        <span id="fsum"></span>
      </div>
      <input id="f-imgs" type="file" accept="image/*" multiple hidden>
      <input id="f-vids" type="file" accept="video/*" hidden>
      <div id="thumbs"></div>
      <input id="f-contact" type="text" placeholder="联系方式（微信号 / 手机 / 邮箱），选填，回复你用">
      <button id="send" type="button">发出去</button>
      <p id="st" role="status"></p>
      <div class="msgfoot">留言后 48 小时内回复 ｜ 全程线上完成，无需见面 ｜ 每单附核验记录</div>
    </div>
  </section>

  <!-- 案例视频：全部是视频，没有文字说明，做一条放一条 -->
  <section id="videos" class="wrap">
    <div class="vhead"><h2>案例视频</h2><span class="vchip">3 条 · 做一条放一条</span></div>
    <p class="vhint">点一下封面，看完整案例（每条约 1 分钟），关掉回到这里。</p>
    <div class="grid">
      <figure class="vcard">
        <video src="assets/videos/v01.mp4" poster="assets/videos/v01.jpg" muted loop playsinline preload="metadata" aria-label="案例视频：老师傅一请假，厂里谁敢接他的活"></video>
        <span class="play" aria-hidden="true"></span>
        <figcaption><span class="no">置顶 01</span>老师傅一请假，厂里谁敢接他的活？</figcaption>
      </figure>
      <figure class="vcard">
        <video src="assets/videos/v02.mp4" poster="assets/videos/v02.jpg" muted loop playsinline preload="metadata" aria-label="案例视频：一道折弯工序，看AI能不能接住"></video>
        <span class="play" aria-hidden="true"></span>
        <figcaption><span class="no">置顶 02</span>一道折弯工序，看AI能不能接住</figcaption>
      </figure>
      <figure class="vcard">
        <video src="assets/videos/v03.mp4" poster="assets/videos/v03.jpg" muted loop playsinline preload="metadata" aria-label="案例视频：帮1000家工厂，把老师傅经验留下来"></video>
        <span class="play" aria-hidden="true"></span>
        <figcaption><span class="no">置顶 03</span>帮1000家工厂，把老师傅经验留下来</figcaption>
      </figure>
      <div class="vcard soon">下一条，正在做</div>
    </div>
  </section>
</main>

<button id="totop" type="button" aria-label="回到留言板">↑</button>
<div id="vp" role="dialog" aria-label="视频播放"><button id="vpc" type="button" aria-label="关闭">×</button><video id="vpv" src="" controls autoplay playsinline></video></div>
<footer><div class="wrap">
  <span>© 2026 DistillLab 蒸馏研究室</span>
  <span>「蒸」——我们的本行：把厚的，蒸成薄的。</span>
  <a href="https://github.com/distilllab">GitHub 开源</a>
</div></footer>

<script>
(function(){
  var MAXTOTAL=9.5*1024*1024,MAXFILES=5;
  var btn=document.getElementById("send"),st=document.getElementById("st"),
      msgEl=document.getElementById("f-msg"),ctEl=document.getElementById("f-contact"),
      thumbs=document.getElementById("thumbs"),fsum=document.getElementById("fsum"),
      files=[];
  function fmt(n){return n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB"}
  function total(){return files.reduce(function(s,f){return s+f.size},0)}
  function say(t){st.style.color="#cde8d8";st.textContent=t}
  function warn(t){st.style.color="#ffd479";st.textContent=t}
  function isVid(f){return /^video\//.test(f.type)||/\.(mp4|mov|3gp|webm|avi|mkv|m4v)$/i.test(f.name)}
  /* 草稿自动保存：转页面/切走再回来内容还在，发成功才清 */
  try{var d=JSON.parse(localStorage.getItem("dl_draft")||"{}");if(d.m)msgEl.value=d.m;if(d.c)ctEl.value=d.c}catch(e){}
  function saveDraft(){try{localStorage.setItem("dl_draft",JSON.stringify({m:msgEl.value,c:ctEl.value}))}catch(e){}}
  msgEl.addEventListener("input",saveDraft);
  ctEl.addEventListener("input",saveDraft);
  function render(){
    thumbs.innerHTML="";
    files.forEach(function(f,i){
      var d=document.createElement("span");d.className="th";
      if(f.thumb){var im=document.createElement("img");im.src=f.thumb;d.appendChild(im)}
      var t=document.createElement("span");
      t.textContent=(f.video?"[视频] ":"")+f.name+"（"+fmt(f.size)+"）";
      d.appendChild(t);
      var x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","删除附件");
      x.onclick=function(){if(f.thumb)URL.revokeObjectURL(f.thumb);files.splice(i,1);render()};
      d.appendChild(x);thumbs.appendChild(d);
    });
    fsum.textContent=files.length?"已选 "+files.length+" 个，共 "+fmt(total())+"（上限 10MB）":"";
  }
  function compress(file){
    return new Promise(function(res){
      if(!/^image\//.test(file.type)){res(file);return}
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){
        try{
          var max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          c.toBlob(function(b){
            URL.revokeObjectURL(url);
            if(b&&b.size<file.size){res(new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}))}
            else{res(file)}
          },"image/jpeg",0.82);
        }catch(e){URL.revokeObjectURL(url);res(file)}
      };
      img.onerror=function(){URL.revokeObjectURL(url);res(file)};
      img.src=url;
    });
  }
  function pushFile(f){
    if(files.length>=MAXFILES){warn("一次最多 5 个文件。");return false}
    if(isVid(f)&&f.size>MAXTOTAL){warn("「"+f.name+"」超过 10MB，邮件带不动——扫上方企微码发更快，或拍短一点。");return false}
    files.push({raw:f,done:false,video:isVid(f)});
    return true;
  }
  function finishAdd(){
    Promise.all(files.filter(function(f){return!f.done}).map(function(f){
      return compress(f.raw).then(function(b){
        f.file=b;f.size=b.size;
        /* 附件统一改安全英文文件名（中文名会被邮件通道吞）；原名单独进正文 */
        var ext="jpg";
        if(f.video){var m=/\.(\w{2,4})$/.exec(f.raw.name);ext=m?m[1].toLowerCase():"mp4"}
        else if(/\.png$/i.test(f.raw.name))ext="png";
        else if(/\.gif$/i.test(f.raw.name))ext="gif";
        else if(/\.webp$/i.test(f.raw.name))ext="webp";
        else if(/\.heic$/i.test(f.raw.name))ext="heic";
        f.name=(f.video?"vid-":"img-")+Date.now()+"-"+Math.floor(Math.random()*900+100)+"."+ext;
        f.mime=f.video?"video/"+(ext==="mov"?"quicktime":ext):"image/"+ext;
        if(!f.video&&/^image\//.test(f.raw.type))f.thumb=URL.createObjectURL(b);
        f.done=true;
      });
    })).then(render).catch(render);
  }
  document.getElementById("picki").addEventListener("click",function(){document.getElementById("f-imgs").click()});
  document.getElementById("pickv").addEventListener("click",function(){document.getElementById("f-vids").click()});
  document.getElementById("f-imgs").addEventListener("change",function(){
    var list=[].slice.call(this.files);this.value="";
    var ok=list.some(function(f){return pushFile(f)});
    finishAdd();if(ok)say("");
  });
  document.getElementById("f-vids").addEventListener("change",function(){
    var list=[].slice.call(this.files);this.value="";
    var ok=list.some(function(f){return pushFile(f)});
    finishAdd();if(ok)say("");
  });
  btn.addEventListener("click",function(){
    var msg=msgEl.value.trim();
    var contact=ctEl.value.trim();
    if(!msg){warn("写点什么再发——一句话也行。");return}
    if(total()>MAXTOTAL){warn("附件总共超过 10MB，删掉几个再发（大视频可以扫企微码发）。");return}
    var fd=new FormData();
    fd.append("留言内容",msg);
    fd.append("联系方式",contact||"未填");
    fd.append("_subject","官网留言（免费诊断）");
    fd.append("_captcha","false");
    fd.append("_honey","");
    fd.append("_template","table");
    if(contact.indexOf("@")>0)fd.append("_replyto",contact);
    if(files.length){
      fd.append("附件原名",files.map(function(f){return f.raw.name}).join("；"));
      fd.append("附件信息",files.map(function(f){return f.name+" "+f.size+"B "+(f.mime||(f.file||f.raw).type||"未知")}).join("；"));
    }
    /* AJAX通道只认JSON会丢附件：有文件必须走标准表单通道 */
    var url="https://formsubmit.co/ajax/0f6a24b0bad51243e86954dcf52b8dae";
    if(files.length){
      url="https://formsubmit.co/0f6a24b0bad51243e86954dcf52b8dae";
      fd.append("_next","https://distilllab.cn/app.html?sent=1");
      files.forEach(function(f,i){fd.append("attachment"+(i+1),f.file||f.raw,f.name)});
    }
    btn.disabled=true;btn.textContent="发送中…";say("");
    fetch(url,{method:"POST",body:fd,headers:{Accept:"application/json"}})
    .then(function(r){if(!r.ok)throw 0;return files.length?{success:"true"}:r.json()})
    .then(function(j){if(j.success==="true"){say("已发出。48 小时内回复——不合适直接说。");btn.textContent="已发送 ✓";files=[];render();try{localStorage.removeItem("dl_draft")}catch(e){};msgEl.value="";ctEl.value="";}else{throw 0}})
    .catch(function(){btn.disabled=false;btn.textContent="发出去";st.innerHTML="<span style='color:#ffd479'>网络不通？</span>备用：<a href='mailto:hello@distilllab.cn' style='color:#fffef9;font-weight:700;text-decoration:underline'>发邮件</a> 或扫企微码。";});
  });
})();

</script>
<script>
(function(){
  /* 案例视频：封面不自动播（封面才稳），点一下进全屏播放
     防误触：手机边缘左滑=系统返回，易误退。用 history.pushState 拦截——
     开全屏时压一条历史，左滑先消费它关掉全屏（popstate），再滑一次才真退出页面。 */
  var cards=[].slice.call(document.querySelectorAll('.vcard video'));
  var vp=document.getElementById('vp'),vpv=document.getElementById('vpv'),vpc=document.getElementById('vpc');
  var vpOpen=false;
  /* 播放器尺寸按视频真实比例算：矮视口（微信标题栏等）下不会被 max-height 压扁 */
  function fitVP(){
    if(!vpv.videoWidth||!vpv.videoHeight)return;
    var availW=window.innerWidth-40;
    var availH=window.innerHeight*0.9-40;
    var r=vpv.videoWidth/vpv.videoHeight;
    var w=Math.min(availW,availH*r);
    vpv.style.width=Math.round(w)+'px';
    vpv.style.height=Math.round(w/r)+'px';
  }
  vpv.addEventListener('loadedmetadata',fitVP);
  window.addEventListener('resize',fitVP);
  window.addEventListener('orientationchange',fitVP);
  function openVP(v){
    var s=v.getAttribute('src');
    if(!s)return;
    vpv.src=s;
    vp.classList.add('on');
    document.body.style.overflow='hidden';
    if(!vpOpen){history.pushState({vp:1},'',location.href);}
    vpOpen=true;
    fitVP();
    try{vpv.currentTime=0}catch(err){}
    vpv.play().catch(function(){});
  }
  function doClose(nav){
    vp.classList.remove('on');
    vpv.pause();vpv.removeAttribute('src');vpv.load();
    vpv.style.width='';vpv.style.height='';
    document.body.style.overflow='';
    if(nav && vpOpen){history.back();}  // 用户点 X/遮罩：撤销 push，URL 复原
    vpOpen=false;
  }
  window.addEventListener('popstate',function(){
    if(vpOpen){doClose(false);}  // 左滑返回：关全屏即可，不再额外退页
  });
  cards.forEach(function(v){
    v.addEventListener('click',function(){openVP(v)});
  });
  vpc.addEventListener('click',function(e){e.stopPropagation();doClose(true)});
  vp.addEventListener('click',function(e){if(e.target===vp){doClose(true)}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&vpOpen){doClose(true)}});
})();

(function(){
  /* 悬浮回顶：滚过600px出现，点一下平滑回留言板 */
  var b=document.getElementById('totop');
  function onScroll(){
    if(window.pageYOffset>600){b.classList.add('show')}else{b.classList.remove('show')}
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
  b.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
