<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="100%" role="img">
  <title>分身自动化制作系统全景构架图</title>
  <desc>主人层、运营层、九大场景三簇、四分身流水线、底座与商业原则的全景构架</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="15" font-weight="500" fill="#26215C">分身自动化制作系统 · 全景构架 v1</text>
  <text x="40" y="54" font-size="12" fill="#5F5E5A">不做平台做"分身劳动力"供给侧 · 主人只在两头 · 中间全自动 · 2026-10-09</text>

  <text x="40" y="86" font-size="13" font-weight="500" fill="#444441">主人层（只在两头）</text>
  <g>
    <rect x="40" y="96" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="150" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">主人：下指令</text>
    <text x="150" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">一句话下单 · 单字拍板</text>

    <rect x="420" y="96" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="530" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">主人：收成果</text>
    <text x="530" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">交付包 · 待核清单</text>

    <text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">中间全自动</text>
  </g>

  <path d="M150 140 L150 168 M530 140 L530 168" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="40" y="186" font-size="13" font-weight="500" fill="#3C3489">运营层（三个引擎）</text>
  <g>
    <rect x="40" y="196" width="184" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="132" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">工坊总管</text>
    <text x="132" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">派单 · 裁决 · 收口</text>

    <rect x="248" y="196" width="184" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">夜班自动化</text>
    <text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">工作日 21:00 孵化模板</text>

    <rect x="456" y="196" width="184" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="548" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">周蒸馏计划任务</text>
    <text x="548" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">周日 21:00 记忆蒸馏</text>
  </g>

  <path d="M340 240 L340 262" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="282" font-size="13" font-weight="500" fill="#0C447C">场景层（九大场景 · 三簇）</text>

  <rect x="40" y="292" width="192" height="196" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="136" y="312" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">知识蒸馏簇</text>
  <g>
    <rect x="52" y="326" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text x="136" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">01 研报蒸馏 ✅两单</text>
    <rect x="52" y="378" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text x="136" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">02 深度研究 ✅首单</text>
    <rect x="52" y="430" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text x="136" y="452" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">03 书籍蒸馏</text>
  </g>

  <rect x="244" y="292" width="192" height="196" rx="12" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#72243E">人格分身簇</text>
  <g>
    <rect x="256" y="326" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
    <text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#72243E">04 真人分身复刻</text>
    <rect x="256" y="378" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
    <text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#72243E">05 第二人格实体</text>
    <rect x="256" y="430" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="0.5"/>
    <text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#72243E">07 口述家史·家族分身</text>
  </g>

  <rect x="448" y="292" width="192" height="196" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="544" y="312" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">组织与增长簇</text>
  <g>
    <rect x="460" y="326" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="544" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">06 老师傅经验萃取 ★B端</text>
    <rect x="460" y="378" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="544" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">08 账号蒸馏 ★引流</text>
    <rect x="460" y="430" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="544" y="452" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">09 去AI味改写（排队）</text>
  </g>

  <path d="M340 488 L340 512" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="532" font-size="13" font-weight="500" fill="#27500A">共享流水线（所有场景同一条）</text>
  <g>
    <rect x="40" y="544" width="132" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="106" y="566" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">选题分身</text>
    <rect x="196" y="544" width="132" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="262" y="566" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">蒸馏分身</text>
    <rect x="352" y="544" width="132" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="418" y="566" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">审校分身</text>
    <rect x="508" y="544" width="132" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="574" y="566" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">归档分身</text>
    <path d="M172 566 L196 566 M328 566 L352 566 M484 566 L508 566" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <path d="M418 588 L418 604 L262 604 L262 592" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="340" y="616" text-anchor="middle" font-size="12" fill="#A32D2D">审校打回闭环：同一件累计打回 ≥2 次即停单报告 · 不许带病放行</text>

  <path d="M340 624 L340 644" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="664" font-size="13" font-weight="500" fill="#854F0B">底座层（两大件）</text>
  <g>
    <rect x="40" y="674" width="295" height="66" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="187" y="694" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#854F0B">长记忆包 v1.2</text>
    <text x="187" y="712" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">三层记忆 · 图谱/FTS 检索</text>
    <text x="187" y="728" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">每日日志 · 周蒸馏候选</text>

    <rect x="345" y="674" width="295" height="66" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="492" y="694" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#854F0B">核验与信用资产</text>
    <text x="492" y="712" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">核验记录公开（31/31 · 17/19）</text>
    <text x="492" y="728" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">成本埋点 · 编号撞车检查</text>
  </g>

  <rect x="40" y="756" width="600" height="40" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="776" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">商业原则：卖劳动力不卖课 · 按结果定价 · 开放文件交付不锁平台 · 每单回填坑清单/核验/成本</text>

  <text x="40" y="816" font-size="12" fill="#888780">对外发布中：yanbao-distill 开源旗（待 GitHub） · 运行全记录：03_运行记录 · 分身自动化制作系统 2026-10-09</text>
</svg>
